name: android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Check backend crates
        run: cargo check -p gamehubx-core -p gamehubx-platform -p gamehubx-storage -p gamehubx-download -p gamehubx-runtime -p gamehubx-supervisor -p gamehubx-input
      - name: Prepare native shader tools
        run: bash thirdparty/winlator/.github/scripts/prepare-native-tools.sh
      - name: Fetch Winlator app assets
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/winlator-assets"
          git -C "$RUNNER_TEMP/winlator-assets" fetch --depth 1 \
            https://github.com/StevenMXZ/Winlator-Ludashi.git 527848f555c4349b26578e714acd4654b6dbd956
          git -C "$RUNNER_TEMP/winlator-assets" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/winlator-assets" sparse-checkout set app/src/main/assets
          git -C "$RUNNER_TEMP/winlator-assets" checkout FETCH_HEAD
          cp -a "$RUNNER_TEMP/winlator-assets/app/src/main/assets/." thirdparty/winlator/app/src/main/assets/
      - name: Fetch Winlator runtime assets
        run: |
          set -euo pipefail
          ASSETS=thirdparty/winlator/app/src/main/assets
          mkdir -p "$ASSETS"
          if [ ! -f "$ASSETS/imagefs.tar.zst" ]; then
            for part in 00 01; do
              curl --fail --location --retry 3 \
                "https://raw.githubusercontent.com/Other-backup/winlator-imagefs-v2/main/imagefs.tar.zst.$part" \
                -o "$ASSETS/imagefs.tar.zst.$part"
            done
            cat "$ASSETS/imagefs.tar.zst.00" "$ASSETS/imagefs.tar.zst.01" > "$ASSETS/imagefs.tar.zst"
            rm -f "$ASSETS"/imagefs.tar.zst.0*
          fi
          PROTON="$ASSETS/proton-11.0-7-arm64ec.tar.zst"
          if [ ! -f "$PROTON" ]; then
            curl --fail --location --retry 3 \
              "https://github.com/Other-backup/winlator-imagefs-v2/releases/download/pnew2/proton-wine-11.0-7-arm64ec.wcp" \
              -o "$PROTON"
          fi
          echo "1ef0bb9efceb2278933b3fa2bfd374999b0d9a7c74045b67b9af8a9b5260f734  $PROTON" | sha256sum -c -
      - name: Fetch Winlator component tools
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request

          base = "https://raw.githubusercontent.com/Other-backup/winlator-imagefs-v2/ludashi-components/component-tools/arm64-v8a/"
          dest = "thirdparty/winlator/app/src/main/jniLibs/arm64-v8a"
          os.makedirs(dest, exist_ok=True)
          manifest = "thirdparty/winlator/app/src/main/scripts/component-tools.json"
          with open(manifest, encoding="utf-8") as handle:
              tools = json.load(handle)
          for name, expected in tools.items():
              target = os.path.join(dest, name)
              if os.path.isfile(target):
                  with open(target, "rb") as handle:
                      if hashlib.sha256(handle.read()).hexdigest() == expected:
                          continue
              part = target + ".part"
              urllib.request.urlretrieve(base + name, part)
              with open(part, "rb") as handle:
                  actual = hashlib.sha256(handle.read()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"component tool checksum mismatch: {name}")
              os.replace(part, target)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK and SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT" -path '*/cmdline-tools/*/bin/sdkmanager' -type f | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "ndk;29.0.14206865"

          ANDROID_JAR=$(find "$SDK_ROOT/platforms" -maxdepth 2 -name android.jar -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$ANDROID_JAR" ]; then
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35"
            ANDROID_JAR=$(find "$SDK_ROOT/platforms" -maxdepth 2 -name android.jar -type f 2>/dev/null | sort -V | tail -1)
          fi

          D8_JAR=$(find "$SDK_ROOT/build-tools" -maxdepth 3 -name d8.jar -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$D8_JAR" ]; then
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "build-tools;35.0.0"
            D8_JAR=$(find "$SDK_ROOT/build-tools" -maxdepth 3 -name d8.jar -type f 2>/dev/null | sort -V | tail -1)
          fi

          echo "android.jar: $ANDROID_JAR"
          echo "d8.jar: $D8_JAR"
          if [ -z "$ANDROID_JAR" ] || [ -z "$D8_JAR" ]; then
            find "$SDK_ROOT/platforms" -maxdepth 2 -name android.jar -print 2>/dev/null || true
            find "$SDK_ROOT/build-tools" -maxdepth 3 -name d8.jar -print 2>/dev/null || true
            echo "Android platform or build-tools missing"
            exit 1
          fi

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.0.12077973"
            echo "ANDROID_PLATFORM=android-35"
            echo "ANDROID_BUILD_TOOLS_VERSION=35.0.0"
            echo "ANDROID_JAR=$ANDROID_JAR"
            echo "ANDROID_D8_JAR=$D8_JAR"
          } >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Prepare release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GAMEHUBX_KEYSTORE_BASE64: ${{ secrets.GAMEHUBX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GAMEHUBX_KEYSTORE_BASE64}" ]; then
            echo "GAMEHUBX_KEYSTORE_BASE64 secret is required for tag builds"
            exit 1
          fi
          echo "$GAMEHUBX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gamehubx-release.keystore"
          echo "GAMEHUBX_KEYSTORE_PATH=$RUNNER_TEMP/gamehubx-release.keystore" >> "$GITHUB_ENV"
      - name: Build native library
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p gamehubx-app --lib
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --no-configuration-cache
      - name: Assemble signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          GAMEHUBX_KEYSTORE_PASSWORD: ${{ secrets.GAMEHUBX_KEYSTORE_PASSWORD }}
          GAMEHUBX_KEY_ALIAS: ${{ secrets.GAMEHUBX_KEY_ALIAS }}
          GAMEHUBX_KEY_PASSWORD: ${{ secrets.GAMEHUBX_KEY_PASSWORD }}
          GAMEHUBX_VERSION_CODE: ${{ github.run_number }}
          GAMEHUBX_VERSION_NAME: ${{ github.ref_name }}
        run: gradle assembleRelease --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --no-configuration-cache
      - name: Upload signed APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" android/app/build/outputs/apk/release/*.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: gamehubx-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: gamehubx-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
